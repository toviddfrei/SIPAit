<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIPAit - Sonda de Producción</title>
    <style>
        :root { --primary: #4CAF50; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { color: var(--primary); border-bottom: 2px solid #333; padding-bottom: 8px; }
        .card { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; color: #b0bec5; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-main { background: var(--primary); }
        .btn-sec { background: #0288D1; }
        .btn-scan { background: #8E24AA; }
        #log { background: #000; color: #00ff66; padding: 10px; font-family: monospace; font-size: 0.75rem; height: 120px; overflow-y: auto; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>SIPAit - Móvil v1.0</h2>

    <div class="card">
        <label>Contexto (Sincronizado):</label>
        <select id="globalContext"></select>
        
        <label>Zona Específica:</label>
        <select id="areaSelect"></select>
    </div>

    <div class="card">
        <label>Activo Identificado:</label>
        <input type="text" id="notes" placeholder="ID de activo o lectura QR...">
        <button class="btn-scan" onclick="handleScan()">📷 Escanear Activo</button>
        <button class="btn-main" onclick="executeCapture()">📍 Registrar Ubicación 3D</button>
        <button class="btn-sec" onclick="exportData()">💾 Exportar Session.json</button>
    </div>

    <div class="card">
        <label>Trazabilidad del Sistema:</label>
        <div id="log">Inicializando sistema...</div>
    </div>
</div>

<script>
    // Estado de la Aplicación
    const state = {
        config: null,
        records: [],
        currentContext: ''
    };

    const logger = (msg) => {
        const log = document.getElementById('log');
        log.innerHTML += `> ${msg}<br>`;
        log.scrollTop = log.scrollHeight;
    };

    async function init() {
        try {
            const res = await fetch('./frontend/config.json');
            state.config = await res.json();
            
            const contextSelect = document.getElementById('globalContext');
            Object.keys(state.config.mapas).forEach(k => {
                const opt = document.createElement('option');
                opt.value = k; opt.textContent = state.config.mapas[k].nombre_mental;
                contextSelect.appendChild(opt);
            });
            
            state.currentContext = contextSelect.value;
            renderAreas();
            logger("Sistema operativo. Configuración cargada.");
        } catch(e) { logger("CRITICAL: Error al cargar config.json"); }
    }

    function renderAreas() {
        const select = document.getElementById('areaSelect');
        select.innerHTML = '';
        state.config.mapas[state.currentContext].zonas.forEach(z => {
            const opt = document.createElement('option');
            opt.value = z; opt.textContent = z;
            select.appendChild(opt);
        });
    }

    document.getElementById('globalContext').onchange = (e) => {
        state.currentContext = e.target.value;
        renderAreas();
    };

    function executeCapture() {
        if (!navigator.geolocation) return logger("ERROR: Sin soporte GPS");
        
        navigator.geolocation.getCurrentPosition(pos => {
            const record = {
                id: `ID-${Date.now()}`,
                context: state.currentContext,
                area: document.getElementById('areaSelect').value,
                coords: { lat: pos.coords.latitude, lon: pos.coords.longitude, alt: pos.coords.altitude || 0 },
                note: document.getElementById('notes').value
            };
            state.records.push(record);
            logger(`Registrado: ${record.id}`);
        }, err => logger(`GPS Error: ${err.message}`), { enableHighAccuracy: true });
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(state.records, null, 2)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `SIPAit_${Date.now()}.json`;
        a.click();
    }

    function handleScan() {
        logger("Iniciando escáner...");
        // Aquí integraremos html5-qrcode
    }

    init();
</script>
</body>
</html>
