<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIPAit - Sonda GPS Móvil Profesional</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 15px; margin: 0; }
        h2 { color: #4CAF50; border-bottom: 2px solid #333; padding-bottom: 8px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { display: block; margin-top: 10px; font-weight: bold; color: #b0bec5; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #4CAF50; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button:active { background: #388E3C; }
        button.secondary { background: #0288D1; margin-top: 8px; }
        button.scan { background: #8E24AA; margin-top: 8px; }
        #log { background: #0a0a0a; color: #00ff66; font-family: monospace; padding: 10px; font-size: 0.8rem; height: 120px; overflow-y: scroll; border: 1px solid #333; border-radius: 4px; margin-top: 10px; }
        .flex { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <h2>SIPAit - Sonda de Campo</h2>

    <!-- Configuración del Contexto -->
    <div class="card">
        <label for="globalContext">Contexto (Cargado de config.json):</label>
        <select id="globalContext"></select>

        <label for="zoneCategory">Área / Edificio / Zona General:</label>
        <input type="text" id="zoneCategory" placeholder="Ej: Edificio Oficinas, Planta Baja...">

        <label for="specificArea">Estancia / Ubicación Específica:</label>
        <div class="flex">
            <input type="text" id="specificAreaInput" placeholder="Ej: Calidad, Despacho, Cocina...">
            <button type="button" onclick="addZone()" style="width: auto; margin-top: 5px; padding: 0 15px;">Añadir</button>
        </div>
        <select id="specificAreaSelect" style="margin-top: 5px;"></select>
    </div>

    <!-- Captura -->
    <div class="card">
        <label for="notes">Notas / Dispositivo Asociado:</label>
        <input type="text" id="notes" placeholder="Ej: Puesto de trabajo PC-04">
        
        <button class="scan" onclick="alert('Módulo de Escáner QR/OCR en desarrollo.')">📷 Escanear Activo (QR/OCR)</button>
        <button onclick="captureLocation()">📍 Capturar Ubicación 3D</button>
        <button class="secondary" onclick="exportJSON()">💾 Descargar JSON del Contexto</button>
    </div>

    <!-- Log -->
    <div class="card">
        <label>Log de Trazabilidad:</label>
        <div id="log">Sistema inicializado. Cargando config...</div>
    </div>

<script>
    let sessionsData = {};
    let appConfig = {};

    async function initApp() {
        try {
            const response = await fetch('./frontend/config.json');
            appConfig = await response.json();
            const contextSelect = document.getElementById('globalContext');
            
            Object.keys(appConfig.mapas).forEach(key => {
                let opt = document.createElement('option');
                opt.value = key;
                opt.textContent = appConfig.mapas[key].nombre_mental;
                contextSelect.appendChild(opt);
                sessionsData[key] = [];
            });
            updateAreas();
            logMessage("Configuración cargada correctamente desde config.json");
        } catch (e) {
            logMessage("AVISO: Usando modo manual (config.json no encontrado).");
        }
    }

    function updateAreas() {
        const context = document.getElementById('globalContext').value;
        const select = document.getElementById('specificAreaSelect');
        select.innerHTML = '';
        if(appConfig.mapas && appConfig.mapas[context]) {
            appConfig.mapas[context].zonas.forEach(z => {
                let opt = document.createElement('option');
                opt.value = z; opt.textContent = z;
                select.appendChild(opt);
            });
        }
    }

    function addZone() {
        const input = document.getElementById('specificAreaInput');
        const select = document.getElementById('specificAreaSelect');
        if(input.value.trim()) {
            let opt = document.createElement('option');
            opt.value = input.value; opt.textContent = input.value;
            select.appendChild(opt);
            select.value = input.value;
            input.value = '';
            logMessage(`Zona añadida: "${opt.textContent}"`);
        }
    }

    function logMessage(msg) {
        const logBox = document.getElementById('log');
        logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById('globalContext').onchange = updateAreas;

    function captureLocation() {
        const context = document.getElementById('globalContext').value;
        const category = document.getElementById('zoneCategory').value;
        const area = document.getElementById('specificAreaSelect').value;
        const notes = document.getElementById('notes').value;

        if (!navigator.geolocation) return alert("GPS no disponible.");

        navigator.geolocation.getCurrentPosition((pos) => {
            const record = {
                record_id: "LOC-" + Date.now(),
                timestamp: new Date().toISOString(),
                context: context,
                zone: { category, specific_area: area },
                coordinates: {
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    altitude: pos.coords.altitude || 0.0,
                    accuracy: pos.coords.accuracy
                },
                metadata: { notes }
            };
            sessionsData[context].push(record);
            logMessage(`Registro guardado: ${record.record_id} (${area})`);
        }, (err) => logMessage(`Error GPS: ${err.message}`), { enableHighAccuracy: true });
    }

    function exportJSON() {
        const context = document.getElementById('globalContext').value;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sessionsData[context], null, 2));
        const a = document.createElement('a');
        a.href = dataStr; a.download = `sipait_${context}_${Date.now()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
    }

    initApp();
</script>
</body>
</html>
