<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAit - Sonda GPS Móvil</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 15px; margin: 0; }
        h2 { color: #4CAF50; border-bottom: 2px solid #333; padding-bottom: 8px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { display: block; margin-top: 10px; font-weight: bold; color: #b0bec5; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #4CAF50; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        button:active { background: #388E3C; }
        button.secondary { background: #0288D1; margin-top: 8px; }
        button.secondary:active { background: #0277BD; }
        #log { background: #0a0a0a; color: #00ff66; font-family: monospace; padding: 10px; font-size: 0.8rem; height: 120px; overflow-y: scroll; border: 1px solid #333; border-radius: 4px; margin-top: 10px; }
        .flex { display: flex; gap: 10px; }
        .flex input { flex: 1; }
    </style>
</head>
<body>

    <h2>SIPAit - Sonda GPS</h2>

    <!-- Configuración del Contexto -->
    <div class="card">
        <label for="globalContext">Contexto Global (Mapa/Fichero):</label>
        <select id="globalContext">
            <option value="fabrica">Fábrica</option>
            <option value="casa">Casa</option>
            <option value="amigo">Casa Amigo</option>
            <option value="externo">Cliente Externo</option>
        </select>

        <label for="zoneCategory">Área / Edificio / Zona General:</label>
        <input type="text" id="zoneCategory" placeholder="Ej: Edificio Oficinas, Planta Baja..." value="Oficinas Centrales">

        <label for="specificArea">Estancia / Ubicación Específica:</label>
        <div class="flex">
            <input type="text" id="specificAreaInput" placeholder="Ej: Calidad, Despacho, Cocina...">
            <button type="button" onclick="addZone()" style="width: auto; margin-top: 5px; padding: 0 15px;">Añadir</button>
        </div>
        <select id="specificAreaSelect" style="margin-top: 5px;">
            <option value="Departamento Calidad">Departamento Calidad</option>
            <option value="Sala de Servidores">Sala de Servidores</option>
            <option value="Pasillo Principal">Pasillo Principal</option>
        </select>
    </div>

    <!-- Captura -->
    <div class="card">
        <label for="notes">Notas / Dispositivo Asociado:</label>
        <input type="text" id="notes" placeholder="Ej: Puesto de trabajo PC-04">

        <button onclick="captureLocation()">📍 Capturar Ubicación 3D</button>
        <button class="secondary" onclick="exportJSON()">💾 Descargar JSON del Contexto</button>
    </div>

    <!-- Trazabilidad / Log -->
    <div class="card">
        <label>Log de Trazabilidad:</label>
        <div id="log">Sistema inicializado. Listo para capturar...</div>
    </div>

<script>
    // Almacenamiento local en memoria de la sesión
    let sessionsData = {
        fabrica: [],
        casa: [],
        amigo: [],
        externo: []
    };

    function logMessage(msg) {
        const logBox = document.getElementById('log');
        const timestamp = new Date().toLocaleTimeString();
        logBox.innerHTML += `[${timestamp}] ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function addZone() {
        const input = document.getElementById('specificAreaInput');
        const select = document.getElementById('specificAreaSelect');
        const val = input.value.trim();
        
        if(val) {
            let option = document.createElement('option');
            option.value = val;
            option.textContent = val;
            select.appendChild(option);
            select.value = val;
            input.value = '';
            logMessage(`Zona específica añadida a la librería: "${val}"`);
        }
    }

    function captureLocation() {
        const context = document.getElementById('globalContext').value;
        const category = document.getElementById('zoneCategory').value;
        const area = document.getElementById('specificAreaSelect').value;
        const notes = document.getElementById('notes').value;

        if (!navigator.geolocation) {
            logMessage("ERROR: El navegador no soporta geolocalización.");
            alert("Tu navegador no soporta geolocalización.");
            return;
        }

        logMessage(`Solicitando señal GPS 3D para [${context} -> ${area}]...`);

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const alt = position.coords.altitude !== null ? position.coords.altitude : 0.0;
                const accuracy = position.coords.accuracy;

                const recordId = "LOC-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" + Math.floor(1000 + Math.random() * 9000);

                const record = {
                    record_id: recordId,
                    timestamp: new Date().toISOString(),
                    zone: {
                        category: category,
                        specific_area: area
                    },
                    coordinates: {
                        latitude: lat,
                        longitude: lon,
                        altitude: alt,
                        accuracy_meters: accuracy
                    },
                    metadata: {
                        notes: notes
                    }
                };

                // Asegurar que existe el array para ese contexto
                if (!sessionsData[context]) {
                    sessionsData[context] = [];
                }

                sessionsData[context].push(record);
                logMessage(`¡ÉXITO! ID: ${recordId} registrado. Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}, Alt: ${alt.toFixed(1)}m (Precisión: ${accuracy}m)`);
            },
            (error) => {
                logMessage(`ERROR GPS (${error.code}): ${error.message}`);
                alert("No se pudo obtener la ubicación. Comprueba que el GPS del móvil esté activado.");
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    function exportJSON() {
        const context = document.getElementById('globalContext').value;
        const records = sessionsData[context] || [];

        if (records.length === 0) {
            logMessage(`AVISO: No hay registros acumulados para el contexto "${context}".`);
            alert("No hay registros en este contexto para exportar.");
            return;
        }

        const dataStructure = {
            global_context: context,
            export_timestamp: new Date().toISOString(),
            total_records: records.length,
            locations: records
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataStructure, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `sipait_${context}_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        logMessage(`Fichero JSON exportado con éxito para el contexto: ${context} (${records.length} registros).`);
    }
</script>

</body>
</html>
